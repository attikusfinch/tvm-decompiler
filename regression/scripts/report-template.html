tor-tools select{min-width:0;flex:1;max-width:100%;background:#19273b;color:#e3eaf3;border:0;font:12px Consolas,monospace;outline-offset:0}.editor-tools select option{background:#19273b}.icon-button{background:#ffffff0e;color:#b8c9dc;border:1px solid #ffffff20;border-radius:5px;font-size:11px;padding:4px 8px;white-space:nowrap}.icon-button:hover{background:#ffffff20}.editor{height:565px;overflow:auto;background:var(--code);color:var(--code-ink);margin:0;padding:13px 0;font:12px/1.65 Consolas,"Cascadia Code",monospace;tab-size:4}.editor .line{display:grid;grid-template-columns:42px auto;min-width:max-content;min-height:19.8px;padding-right:15px}.editor .ln{color:#60738b;text-align:right;padding-right:12px;user-select:none}.editor .txt{white-space:pre}.editor.wrap .line{min-width:0}.editor.wrap .txt{white-space:pre-wrap;overflow-wrap:anywhere}.token-comment{color:#89a08f}.token-string{color:#e9bf8a}.token-keyword{color:#91baf4}.token-number{color:#bcaceb}.editor-footer{padding:9px 14px;color:var(--muted);font-size:11px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:9px;margin-top:auto}.editor-footer label{display:flex;align-items:center;gap:5px;cursor:pointer}.editor-footer input{accent-color:var(--accent);margin:0}.after-compile{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:18px 0 30px}.result-card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:15px 17px}.result-card .label{font-size:11px;color:var(--muted)}.result-card strong{font-size:19px;display:block;margin:4px 0;line-height:1.4}.result-card p{font-size:11px;color:var(--muted);line-height:1.5}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-top:27px;margin-bottom:13px}.section-head p{font-size:12px;color:var(--muted)}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:11px;background:#fff}table{width:100%;border-collapse:collapse;text-align:left;font-size:12px}th{padding:12px 1 <body>
<header class="masthead"><div class="shell">
  <div class="topline"><div class="brand"><span class="brand-mark" aria-hidden="true">↔</span>TVM DECOMPILER / ACTON</div><a href="https://github.com/attikusfinch/tvm-decompiler" target="_blank" rel="noopener">Форк на GitHub ↗</a></div>
  <div class="intro"><div><h1>Из исходника — в TVM — обратно</h1><p>Все восемь контрактов из шаблонов Acton: <code>empty</code>, <code>counter</code>, <code>nft</code>, <code>jetton</code> и <code>w5-extension</code>. Исходный Tolk, скомпилированный код и результат нашего декомпилятора.</p><label style="display:block;margin-top:18px">Язык декомпиляции: <select class="download" id="output-language" aria-label="Язык декомпиляции"></select></label></div><div class="metrics" id="overview"></div></div>
</div></header>
<nav class="contract-nav" aria-label="Контракты"><div class="shell nav-inner" id="contract-tabs" role="tablist" aria-label="Выбор контракта"></div></nav>
<main class="shell workspace" id="contract-panel" role="tabpanel" tabindex="0"></main>
<noscript>Для переключения контрактов и просмотра кода нужен JavaScript. Все данные встроены в этот HTML: подключение к интернету не требуется.</noscript>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<script id="report-data" type="application/json">__REPORT_DATA__</script>
<script>
'use strict';
const DATA = JSON.parse(document.getElementById('report-data').textContent);
const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
const count = (items, field) => (items ?? []).filter(item => item[field]).length;
const shortHash = value => value.slice(0, 12) + '…' + value.slice(-8);
const badge = (text, kind = '') => '<span class="badge ' + kind + '">' + esc(text) + '</span>';
let current, toastTimer;
let outputLanguage = DATA.languages.includes('tolk') ? 'tolk' : 'func';
const languageName = () => outputLanguage === 'tolk' ? 'Tolk' : 'FunC';
const variant = contract => ({ ...contract, ...contract.outputs[outputLanguage] });
const labels = {
  'change owner':'Смена владельца','unauthorized change owner':'Смена владельца без прав',
  'increase':'Увеличение счётчика','decrease':'Уменьшение счётчика','reset':'Сброс счётчика',
  'unauthorized sender':'Отправитель без прав','underflow':'Недостаточное значение','overflow':'Переполнение uint32',
  'unknown operation':'Неизвестная операция','empty message':'Пустое сообщение','bounced message':'Сообщение bounce',
  'ownership transfer':'Передача NFT','ownership notification':'Уведомление нового владельца','ownership excesses':'Возврат остатка при передаче',
  'unauthorized transfer':'Передача без прав','malformed forward payload':'Некорректный forward payload','static data response':'Ответ со статическими данными',
  'transfer':'Перевод токенов','insufficient balance':'Недостаточно токенов','burn':'Сжигание токенов','unauthorized burn':'Сжигание без прав',
  'receive from minter':'Приём от минтера','unauthorized receive':'Приём без прав','restore bounced transfer':'Возврат токенов после bounce',
  'top up':'Пополнение TON','change admin':'Смена администратора','unauthorized change admin':'Смена администратора без прав',
  'claim admin':'Принятие прав администратора','drop admin':'Отказ от прав администратора','change metadata':'Изменение метаданных',
  'wallet discovery':'Ответ с адресом кошелька','mint':'Выпуск токенов','restore bounced mint':'Возврат выпуска после bounce',
  'cancel subscription':'Отмена подписки','unauthorized cancellation':'Отмена подписки без прав',
  'receive subscription payment':'Приём платежа от кошелька','unauthorized subscription payment':'Платёж не от кошелька',
  'extension no actions':'Расширение без действий','add extension':'Добавление расширения','remove extension':'Удаление расширения',
  'disable signatures':'Отключение подписей','unsupported extra action':'Неизвестное extra action','unauthorized extension':'Незарегистрированное расширение',
  'short signed request':'Короткий подписанный запрос','invalid signature':'Некорректная подпись',
};
function status(contract) {
  if (!contract.complete) return { text:'Частичная декомпиляция', kind:'error' };
  if (!contract.recompiled) return { text:'Ошибка рекомпиляции', kind:'error' };
  if (contract.report.status !== 'passed') return { text:'Есть различия при исполнении', kind:'warn' };
  return { text:'Все выполненные проверки совпали', kind:'' };
}
function highlight(text, language) {
  if (language === 'plain') return esc(text);
  const regex = /(?:\/\/|;;).*?$|"(?:\\.|[^"\\])*"(?:s)?|\b(?:import|contract|type|struct|enum|fun|get|val|var|match|else|assert|throw|return|if|while|repeat|const|slice|cell|builder|tuple|int|impure|method_id|inline_ref|asm|private|mutate|true|false|null)\b|\b(?:0x[\da-fA-F]+|\d+)\b/g;
  let html = '', position = 0;
  for (const match of text.matchAll(regex)) {
    html += esc(text.slice(position, match.index));
    const token = match[0], kind = /^(\/\/|;;)/.test(token) ? 'comment' : token[0] === '"' ? 'string' : /^\d/.test(token) ? 'number' : 'keyword';
    html += '<span class="token-' + kind + '">' + esc(token) + '</span>';
    position = match.index + token.length;
  }
  return html + esc(text.slice(position));
}
function editorMarkup(key, title, description, step, files) {
  return '<section class="stage" data-stage="' + key + '"><div class="stage-head"><div class="stage-title"><span class="step">0' + step + '</span><h3>' + title + '</h3></div><p>' + description + '</p></div><div class="editor-tools"><select aria-label="Файл: ' + title + '" data-file-select="' + key + '">' + files.map((file, index) => '<option value="' + index + '">' + esc(file.name) + '</option>').join('') + '</select><button class="icon-button" data-copy="' + key + '" title="Скопировать полный текст выбранного файла">Копия</button><button class="icon-button" data-save="' + key + '" title="Скачать выбранный файл">↓</button></div><pre class="editor wrap" id="editor-' + key + '" aria-label="' + title + '"><code></code></pre><div class="editor-footer"><span id="editor-info-' + key + '"></span><label><input type="checkbox" checked data-wrap="' + key + '">Перенос строк</label></div></section>';
}
function selectedFile(key) {
  const list = key === 'original' ? current.sources : key === 'compiled' ? current.compiledViews : current.decompiled;
  return list[Number(document.querySelector('[data-file-select="' + key + '"]').value)];
}
function showFile(key) {
  const file = selectedFile(key), lines = file.content.split('\n'), editor = document.querySelector('#editor-' + key);
  editor.querySelector('code').innerHTML = lines.map((line, index) => '<span class="line"><span class="ln" aria-hidden="true">' + (index + 1) + '</span><span class="txt">' + (highlight(line.replace(/\r$/, ''), file.language) || ' ') + '</span></span>').join('');
  editor.scrollTop = 0; editor.scrollLeft = 0;
  document.getElementById('editor-info-' + key).textContent = lines.length + ' строк · ' + new TextEncoder().encode(file.content).length.toLocaleString('ru-RU') + ' байт';
}
function tell(text) {
  clearTimeout(toastTimer); const toast = document.getElementById('toast');
  toast.textContent = text; toast.hidden = false; toastTimer = setTimeout(() => toast.hidden = true, 2300);
}
function download(name, contents, mime = 'text/plain;charset=utf-8') {
  const url = URL.createObjectURL(new Blob([contents], { type:mime }));
  const anchor = document.createElement('a'); anchor.href = url; anchor.download = name; anchor.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
}
function fromBase64(base64) { return Uint8Array.from(atob(base64), char => char.charCodeAt(0)); }
async function copy(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const area = document.createElement('textarea'); area.value = text; area.style.cssText='position:fixed;left:-9999px'; document.body.append(area); area.select();
    const copied = document.execCommand('copy'); area.remove(); if (!copied) return tell('Используйте кнопку скачивания файла');
  }
  tell('Текст скопирован');
}
function notice(contract) {
  if (!contract.complete) {
    const diagnostic = contract.report.diagnostics[0];
    return '<div class="notice error"><strong>' + esc(diagnostic.mnemonic) + ': ' + esc(diagnostic.message) + '</strong><p>' + languageName() + ' справа — частичный результат. Декомпилятор вернул <code>complete=false</code>; рекомпиляция и сравнение исполнения не запускались. Диагностика: метод <code>' + esc(diagnostic.methodId) + '</code>, <code>' + esc(diagnostic.location) + '</code>. Это логическая позиция парсера, а не битовый адрес инструкции.</p></div>';
  }
  if (!contract.recompiled) return '<div class="notice error"><strong>Компилятор отклонил результат</strong><p>' + esc(contract.report.message) + '</p></div>';
  const probes = [...(contract.report.getters ?? []), ...(contract.report.messages ?? [])];
  const failed = probes.filter(probe => !probe.sameObservedBehavior).length;
  const title = failed ? 'Рекомпиляция успешна; отличаются ' + failed + ' из ' + probes.length + ' проверок'
    : 'Рекомпиляция успешна; поведение совпало в ' + probes.length + ' проверках';
  const text = failed ? 'Результаты геттеров, хранилище, исходные действия и сообщения приведены ниже. Изменение MYCODE и расхода газа может менять адреса и суммы TON.'
    : 'Все выполненные геттеры и внутренние сообщения дали одинаковые результаты. Расход газа и хеш кода проверяются отдельно и показаны ниже.';
  return '<div class="notice ' + (failed ? 'warn' : '') + '"><strong>' + title + '</strong><p>' + text + '</p></div>';
}
function gas(before, after) {
  const delta = BigInt(after) - BigInt(before);
  return '<span class="gas">' + esc(before) + ' → ' + esc(after) + (delta ? '<span class="delta">(' + (delta > 0n ? '+' : '') + delta + ')</span>' : '') + '</span>';
}
function tableGetters(contract) {
  const probes = contract.report.getters ?? [];
  if (!probes.length) return '<div class="empty-test">Геттеров в наборе: ' + contract.inputs.getters.length + '. Сравнение не выполнено: код восстановлен частично.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>Геттер / method_id</th><th>Exit до → после</th><th>Стек результата</th><th>Газ до → после</th></tr></thead><tbody>' + probes.map(probe => {
    const name = typeof probe.method === 'number' ? contract.getters.find(item => item.methodId === probe.method)?.name : probe.method;
    return '<tr><td class="mono">' + esc(name ?? probe.method) + '</td><td class="mono">' + probe.before.exitCode + ' → ' + probe.after.exitCode + '</td><td>' + badge(probe.sameObservedBehavior ? 'Совпадает' : 'Отличается', probe.sameObservedBehavior ? '' : 'warn') + '</td><td>' + gas(probe.before.gasUsed, probe.after.gasUsed) + '</td></tr>';
  }).join('') + '</tbody></table></div>';
}
function tableMessages(contract) {
  const probes = contract.report.messages ?? [];
  if (!probes.length) return '<div class="empty-test">Внутренних сообщений в наборе: ' + contract.inputs.messages.length + '. Сравнение не выполнено из-за диагностики декомпилятора. Полный перечень сценариев доступен в исходных данных ниже.</div>';
  return '<div class="table-wrap"><table><thead><tr><th>Сценарий</th><th>Exit до → после</th><th>Хранилище</th><th>Исходные действия</th><th>Исходящие сообщения</th><th>Газ до → после</th></tr></thead><tbody>' + probes.map(probe => {
    const dataMatches = probe.before.dataHash === probe.after.dataHash;
    const actionsMatch = JSON.stringify(probe.before.actions) === JSON.stringify(probe.after.actions);
    const messagesMatch = JSON.stringify(probe.before.outMessages) === JSON.stringify(probe.after.outMessages);
    return '<tr><td>' + esc(labels[probe.label] ?? probe.label) + '</td><td class="mono">' + probe.before.exitCode + ' → ' + probe.after.exitCode + '</td><td>' + badge(dataMatches ? 'Совпадает' : 'Отличается', dataMatches ? '' : 'warn') + '</td><td>' + badge(actionsMatch ? 'Совпадают' : 'Отличаются', actionsMatch ? '' : 'warn') + '</td><td>' + badge(messagesMatch ? 'Совпадают' : 'Отличаются', messagesMatch ? '' : 'warn') + '</td><td>' + gas(probe.before.gasUsed, probe.after.gasUsed) + '</td></tr>';
  }).join('') + '</tbody></table></div>';
}
function differences(contract) {
  const results = [];
  for (const probe of contract.report.messages ?? []) {
    if (probe.sameObservedBehavior) continue;
    const before = probe.before.outMessages[0], after = probe.after.outMessages[0];
    if (!before || !after) continue;
    let values = 'TON, нанотоны: ' + before.value + ' → ' + after.value;
    let text = 'Хранилище, тело сообщения и исходные действия совпали. Изменился расход газа и сумма исходящего сообщения.';
    if (before.destination !== after.destination) {
      text = 'Новый хеш собственного кода (MYCODE) изменил state-init и адрес назначения. Это существенное различие поведения.';
      values += '\nАдрес до: ' + before.destination + '\nАдрес после: ' + after.destination;
      values += '\nКод state-init до: ' + before.init.code.cellHash + '\nКод state-init после: ' + after.init.code.cellHash;
    }
    results.push('<article class="difference"><h3>' + esc(labels[probe.label] ?? probe.label) + '</h3><p>' + text + '</p><div class="difference-values">' + esc(values).replaceAll('\n','<br>') + '</div></article>');
  }
  if (contract.id === 'JettonWallet') results.unshift('<article class="difference"><h3>get_wallet_data → собственный код</h3><p>Число токенов и адреса совпадают, но возвращаемая ячейка кода имеет другой хеш.</p><div class="difference-values">До: ' + esc(contract.original.codeHash) + '<br>После: ' + esc(contract.recompiled.codeHash) + '</div></article>');
  return results.length ? '<div class="section-head"><h3>Где появились различия</h3><p>Значения из локального TON Sandbox</p></div><div class="difference-row">' + results.join('') + '</div>' : '';
}
function overviewTable() {
  return '<div class="section-head"><h3>Все шаблоны · ' + languageName() + '</h3><p>Геттеры и сообщения: совпавшие / выполненные проверки</p></div><div class="table-wrap all-summary"><table><thead><tr><th>Контракт</th><th>BOC до → после</th><th>Рекомпиляция</th><th>Геттеры</th><th>Сообщения</th></tr></thead><tbody>' + DATA.contracts.map(variant).map(contract => {
    const r = contract.report;
    return '<tr><td><button class="print-button mono" data-contract="' + contract.id + '">' + contract.id + '</button></td><td class="mono nowrap">' + contract.original.bytes + ' → ' + (contract.recompiled?.bytes ?? '—') + ' байт</td><td>' + badge(contract.recompiled ? 'Успешно' : 'Не запускалась', contract.recompiled ? '' : 'error') + '</td><td>' + (r.getters ? count(r.getters,'sameObservedBehavior') + '/' + r.getters.length : 'Не выполнены') + '</td><td>' + (r.messages ? count(r.messages,'sameObservedBehavior') + '/' + r.messages.length : 'Не выполнены') + '</td></tr>';
  }).join('') + '</tbody></table></div>';
}
function render(id, changeHash = true) {
  current = variant(DATA.contracts.find(contract => contract.id === id) ?? DATA.contracts[0]);
  const c = current, state = status(c), r = c.report;
  if (changeHash) history.replaceState(null, '', '#' + c.id);
  for (const tab of document.querySelectorAll('[role=tab]')) {
    const active = tab.dataset.contract === c.id;
    tab.setAttribute('aria-selected', String(active)); tab.tabIndex = active ? 0 : -1;
    tab.querySelector('.dot').className = 'dot ' + status(variant(DATA.contracts.find(contract => contract.id === tab.dataset.contract))).kind;
  }
  document.getElementById('contract-panel').setAttribute('aria-labelledby', 'tab-' + c.id);
  const cards = [
    ['BOC: размер кода', c.original.bytes + ' → ' + (c.recompiled?.bytes ?? '—') + ' байт', c.recompiled ? 'После ' + languageName() + ' → TVM: ' + (c.recompiled.bytes - c.original.bytes > 0 ? '+' : '') + (c.recompiled.bytes - c.original.bytes) + ' байт.' : 'Рекомпиляция частичного кода не запускалась.'],
    ['Хеш кодовой ячейки', c.recompiled ? (r.sameCodeCell ? 'Совпадает' : 'Изменился') : 'Не сравнивался', c.recompiled ? 'Байты сериализованного BOC: ' + (r.sameSerializedBoc ? 'совпадают.' : 'тоже отличаются.') : 'Оригинальный BOC доступен для скачивания.'],
    ['Геттеры', r.getters ? count(r.getters,'sameObservedBehavior') + ' / ' + r.getters.length : 'Не выполнены', 'Сравниваем exit code и весь стек результата.'],
    ['Сообщения', r.messages ? count(r.messages,'sameObservedBehavior') + ' / ' + r.messages.length : 'Не выполнены', 'Сравниваем эффекты и исходящие сообщения, включая TON.'],
  ];
  document.getElementById('contract-panel').innerHTML =
    '<div class="contract-head"><div><div class="eyebrow">' + esc(c.project) + ' / ' + c.sources.length + ' файлов Tolk</div><h2>' + c.id + '</h2><p>' + c.description + '</p></div>' + badge(state.text,state.kind) + '</div>' + notice(c) +
    '<div class="pipeline">' +
      editorMarkup('original','Исходный контракт','Авторский Tolk из шаблона Acton. В списке — основной файл и его локальные зависимости.',1,c.sources) +
      editorMarkup('compiled','Скомпилированный TVM','BOC — бинарный код. Ниже его дизассемблирование Acton: инструкции, хеши ячеек и битовые смещения.',2,c.compiledViews) +
      editorMarkup('decompiled','После декомпиляции · ' + languageName(),'Фактический ' + languageName() + ' из нашего форка. Имена и структура приведены без ручного восстановления.' + (!c.complete ? ' Результат частичный.' : ''),3,c.decompiled) +
    '</div><div class="after-compile">' + cards.map(card => '<div class="result-card"><div class="label">' + card[0] + '</div><strong>' + card[1] + '</strong><p>' + card[2] + '</p></div>').join('') + '</div>' +
    '<div class="section-head"><h3>Что стало с геттерами</h3><p>Имена исходника → идентификаторы, сохранённые в TVM</p></div><div class="table-wrap mapping"><table><thead><tr><th>Исходный Tolk</th><th>Восстановленный ' + languageName() + '</th><th>method_id</th><th>Состояние</th></tr></thead><tbody>' + c.getters.map(getter => '<tr><td>' + getter.name + '</td><td>fn_' + getter.methodId + '</td><td>' + getter.methodId + '</td><td>' + (c.complete ? 'Сравнение ниже' : 'Частичный код; не проверен') + '</td></tr>').join('') + '</tbody></table></div><p class="table-legend">BOC сохраняет идентификаторы методов. Имена переменных, типы структур, комментарии и исходные имена геттеров в этих BOC не сохранены; справа используются сгенерированные имена.</p>' +
    '<div class="section-head"><h3>Результаты геттеров</h3><p>Исходный TVM → ' + languageName() + ', скомпилированный обратно в TVM</p></div>' + tableGetters(c) +
    '<div class="section-head"><h3>Результаты внутренних сообщений</h3><p>Каждый сценарий начинается с одинакового исходного состояния</p></div>' + tableMessages(c) +
    '<p class="table-legend">«Исходные действия» — список действий VM до обработки action phase. «Исходящие сообщения» — итоговые сообщения после её выполнения. Газ указан отдельно; остаток баланса самого контракта не сравнивается. Внешние сообщения в этом наборе не сравнивались. Это результаты конечного набора проверок, а не доказательство полной эквивалентности.</p>' + differences(c) +
    '<details><summary>BOC, хеши и файлы для скачивания</summary><div class="details-body"><div class="hash-grid"><div>Исходная кодовая ячейка<div class="hash">' + c.original.codeHash + '</div>SHA-256 файла original.boc<div class="hash">' + c.original.sha256 + '</div></div><div>Кодовая ячейка после рекомпиляции<div class="hash">' + (c.recompiled?.codeHash ?? 'Рекомпиляция не запускалась') + '</div>SHA-256 файла recompiled.boc<div class="hash">' + (c.recompiled?.sha256 ?? '—') + '</div></div></div><p>Исходный BOC: ' + c.cells.cells + ' уникальных ячеек, ' + c.cells.bits + ' бит данных и ' + c.cells.refs + ' ссылок. Хеш кодовой ячейки и SHA-256 BOC-файла вычислены отдельно.</p><div class="downloads"><button class="download" data-download="original">Исходный BOC</button><button class="download" data-download="recompiled" ' + (c.recompiled ? '' : 'disabled') + '>BOC после рекомпиляции</button><button class="download" data-download="sources">Исходники Tolk · JSON</button><button class="download" data-download="decompiled">' + languageName() + ' · JSON</button><button class="download" data-download="report">Полный отчёт · JSON</button></div></div></details>' +
    '<details><summary>Условия проверки и исходные данные</summary><div class="details-body"><p>TON Sandbox; баланс 10 TON, значение обычного входящего сообщения 1 TON. Время фиксировано: 1700000000; random seed — 32 нулевых байта. Каждый сценарий использует новую копию контракта. Все ' + (r.messages?.length ?? 0) + ' выполненных сообщений соответствуют ожидаемым exit code и числу исходящих сообщений в оригинале.</p><p style="margin-top:8px">Адреса и хранилище синтетические. Проверки выполнялись локально.</p><pre class="schema">' + esc(JSON.stringify(c.inputs,null,2)) + '</pre></div></details>' +
    '<details><summary>Полная диагностика декомпилятора</summary><div class="details-body"><pre class="schema">' + esc(JSON.stringify({ complete:c.complete, diagnostics:r.diagnostics ?? [], request:c.request },null,2)) + '</pre></div></details>' +
    '<details><summary>Лицензия шаблона и конфигурация Acton</summary><div class="details-body"><pre class="schema">' + esc(c.license) + '</pre><pre class="schema">' + esc(c.config) + '</pre></div></details>' + overviewTable() +
    '<div class="footer"><div><p>Исходные артефакты: Acton ' + esc(DATA.acton) + '. Язык результата: ' + languageName() + '. Декомпилятор и режим: <code style="overflow-wrap:anywhere">' + esc(c.request.endpoint) + '</code>.</p><p>Рекомпиляция: ' + (c.outputLanguage === 'tolk' ? esc(c.compiler.acton) : 'TON v2026.08, FunC 0.4.6 / Fift, коммит 3d478cb') + '. Проверки: ' + new Date(c.checkedAt).toLocaleString('ru-RU', { timeZone:'Asia/Tashkent' }) + ' (Ташкент, UTC+5).</p><p>Версии инструментов и SHA-256 JAR сохранены в JSON. Стандартные библиотеки исходного Tolk подключаются Acton; локальные зависимости и сгенерированный код JettonWallet включены. Библиотека результата декомпиляции доступна в списке справа.</p></div><div><p>Один автономный HTML: код, бинарные артефакты и JSON встроены в файл. Можно открыть локально, переслать и скачать любой из артефактов.</p><p><button class="print-button" id="print-report">Печать выбранного контракта</button> · <button class="print-button" id="download-all">Скачать данные всех контрактов · JSON</button></p></div></div>';
  ['original','compiled','decompiled'].forEach(showFile);
  document.querySelectorAll('[data-file-select]').forEach(select => select.addEventListener('change', () => showFile(select.dataset.fileSelect)));
  document.querySelectorAll('[data-wrap]').forEach(input => input.addEventListener('change', () => document.getElementById('editor-' + input.dataset.wrap).classList.toggle('wrap', input.checked)));
  document.querySelectorAll('[data-copy]').forEach(button => button.addEventListener('click', () => copy(selectedFile(button.dataset.copy).content)));
  document.querySelectorAll('[data-save]').forEach(button => button.addEventListener('click', () => {
    const file = selectedFile(button.dataset.save); download(c.id + '-' + file.name.split('/').pop().split(' · ')[0], file.content);
  }));
  document.querySelectorAll('[data-download]').forEach(button => button.addEventListener('click', () => {
    const type = button.dataset.download;
    if (type === 'original' || type === 'recompiled') download(c.id + '-' + type + '.boc', fromBase64(c[type].base64),'application/octet-stream');
    else download(c.id + '-' + (type === 'decompiled' ? c.outputLanguage : type) + '.json',JSON.stringify(type === 'sources' ? c.sources : type === 'decompiled' ? c.decompiled : { ...c.report, inputs:c.inputs, language:c.outputLanguage, compiler:c.compiler, request:c.request, checkedAt:c.checkedAt },null,2),'application/json');
  }));
  document.querySelectorAll('.all-summary [data-contract]').forEach(button => button.addEventListener('click', () => { render(button.dataset.contract); window.scrollTo({ top:document.querySelector('.contract-nav').offsetTop, behavior:'smooth' }); }));
  document.getElementById('print-report').addEventListener('click', () => window.print());
  document.getElementById('download-all').addEventListener('click', () => download('acton-contracts-data.json',JSON.stringify(DATA,null,2),'application/json'));
  showOverview();
}
function showOverview() {
  const contracts = DATA.contracts.map(variant);
  const compiledCount = contracts.filter(contract => contract.recompiled).length;
  const partialCount = contracts.filter(contract => !contract.complete).length;
  document.getElementById('overview').innerHTML = [[String(contracts.length),'контрактов во всех пяти шаблонах'],[compiledCount + ' / ' + contracts.length,languageName() + ' → TVM'],[String(partialCount),'частичный результат · WHILE / AGAINEND']].map(item => '<div class="metric"><strong>' + item[0] + '</strong><span>' + item[1] + '</span></div>').join('');
}
const languageSelect = document.getElementById('output-language');
languageSelect.innerHTML = DATA.languages.map(language => '<option value="' + language + '">' + (language === 'tolk' ? 'Tolk' : 'FunC') + '</option>').join('');
languageSelect.value = outputLanguage;
languageSelect.addEventListener('change', () => { outputLanguage = languageSelect.value; render(current.id); });
document.getElementById('contract-tabs').innerHTML = DATA.contracts.map(variant).map(contract => '<button class="contract-button" role="tab" id="tab-' + contract.id + '" aria-controls="contract-panel" aria-selected="false" tabindex="-1" data-contract="' + contract.id + '"><span class="dot ' + status(contract).kind + '" aria-hidden="true"></span>' + contract.id + '</button>').join('');
document.querySelectorAll('#contract-tabs [data-contract]').forEach(button => button.addEventListener('click', () => render(button.dataset.contract)));
document.getElementById('contract-tabs').addEventListener('keydown', event => {
  const tabs = [...document.querySelectorAll('#contract-tabs [role=tab]')];
  let index = tabs.findIndex(tab => tab === document.activeElement);
  if (!['ArrowLeft','ArrowRight','Home','End'].includes(event.key)) return;
  event.preventDefault(); index = event.key === 'Home' ? 0 : event.key === 'End' ? tabs.length - 1 : (index + (event.key === 'ArrowRight' ? 1 : -1) + tabs.length) % tabs.length;
  render(tabs[index].dataset.contract); tabs[index].focus();
});
window.addEventListener('hashchange', () => render(location.hash.slice(1),false));
render(location.hash.slice(1));
</script>
