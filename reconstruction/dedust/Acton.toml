[package]
name = "dedust-reconstruction"
version = "0.1.0"
description = "Local differential checks for reconstructed DeDust contracts"

[toolchain]
acton = "1.0.0"

[contracts.CpmmDeposit]
src = "CpmmDeposit/main.tolk"
depends = []

[contracts.CpmmAffiliateAccount]
src = "CpmmAffiliateAccount/main.tolk"
depends = []

[contracts.CpmmPosition]
src = "CpmmPosition/main.tolk"
depends = []

[contracts.CpmmPoolV2]
src = "CpmmPoolV2/main.tolk"
depends = ["CpmmDeposit", "CpmmPosition", "CpmmAffiliateAccount"]

[contracts.CpmmPoolV1]
src = "CpmmPoolV1/main.tolk"
depends = ["CpmmDeposit", "CpmmPosition", "CpmmAffiliateAccount"]

# Generated from ClassicBlank/main.fc by the recovery gate's pinned FunC 0.4.4.
# Acton consumes this source-built artifact after compiler/BOC comparison.
[contracts.ClassicBlank]
src = "build/ClassicBlank/code.boc"
depends = []

[contracts.ClassicOperator]
src = "build/ClassicOperator/code.boc"
depends = ["ClassicBlank"]

[contracts.ClassicLpWallet]
src = "build/ClassicLpWallet/code.boc"
depends = []

[contracts.ClassicLiquidityDeposit]
src = "build/ClassicLiquidityDeposit/code.boc"
depends = ["ClassicBlank"]

[contracts.ClassicNativeVault]
src = "build/ClassicNativeVault/code.boc"
depends = ["ClassicBlank"]

[contracts.ClassicJettonVault]
src = "build/ClassicJettonVault/code.boc"
depends = ["ClassicBlank"]

[test]

[fmt]
width = 100

[import-mappings]
acton = ".acton"
tests = "tests"
