[package]
name = "cpmm-recovered"
version = "0.1.0"
description = "DeDust CPMM: normalized, byte-exact recovered contracts"

[toolchain]
acton = "1.2.1"

# Build these artifacts from editable sources with npm run build first.
# Pinned source compilers preserve the deployed bytecode; Acton 1.2 runs tests.

[contracts.CpmmPoolV1]
src = "build/CpmmPoolV1/code.boc"
depends = []

[contracts.CpmmPoolV2]
src = "build/CpmmPoolV2/code.boc"
depends = []

[contracts.CpmmPosition]
src = "build/CpmmPosition/code.boc"
depends = []

[contracts.CpmmDeposit]
src = "build/CpmmDeposit/code.boc"
depends = []

[contracts.CpmmAffiliateAccount]
src = "build/CpmmAffiliateAccount/code.boc"
depends = []

[test]

[fmt]
width = 100

[scripts]
build-exact = "node ../tools/cli.mjs build cpmm"
test-exact = "node ../tools/cli.mjs test cpmm"

[import-mappings]
acton = ".acton"
contracts = "contracts"
tests = "tests"
wrappers = "wrappers"
