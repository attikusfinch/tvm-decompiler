[package]
name = "uranus-recovered"
version = "0.1.0"
description = "Uranus launchpad: normalized, byte-exact recovered contracts"

[toolchain]
acton = "1.2.1"

# Build these artifacts from editable sources with npm run build first.
# Pinned source compilers preserve the deployed bytecode; Acton 1.2 runs tests.

[contracts.UranusFactoryV3]
src = "build/UranusFactoryV3/code.boc"
depends = []

[contracts.UranusMemeV2]
src = "build/UranusMemeV2/code.boc"
depends = []

[contracts.UranusMemeV3]
src = "build/UranusMemeV3/code.boc"
depends = []

[contracts.UranusMemeWalletV3]
src = "build/UranusMemeWalletV3/code.boc"
depends = []

[contracts.UranusMemeWalletV2]
src = "build/UranusMemeWalletV2/code.boc"
depends = []

[contracts.CpmmPoolV1]
src = "../cpmm/build/CpmmPoolV1/code.boc"
depends = []

[contracts.CpmmDeposit]
src = "../cpmm/build/CpmmDeposit/code.boc"
depends = []

[contracts.CpmmPosition]
src = "../cpmm/build/CpmmPosition/code.boc"
depends = []

[contracts.CpmmAffiliateAccount]
src = "../cpmm/build/CpmmAffiliateAccount/code.boc"
depends = []

[contracts.CpmmPoolV2]
src = "../cpmm/build/CpmmPoolV2/code.boc"
depends = []

[test]

[fmt]
width = 100

[scripts]
build-exact = "node ../tools/cli.mjs build uranus"
test-exact = "node ../tools/cli.mjs test uranus"

[import-mappings]
acton = ".acton"
contracts = "contracts"
tests = "tests"
wrappers = "wrappers"
