[package]
name = "x1000-recovered"
version = "0.1.0"
description = "X1000 execution wallet: normalized, byte-exact recovered contracts"

[toolchain]
acton = "1.2.1"

# Build these artifacts from editable sources with npm run build first.
# Pinned source compilers preserve the deployed bytecode; Acton 1.2 runs tests.

[contracts.X1000WalletV2]
src = "build/X1000WalletV2/code.boc"
depends = []

[contracts.UranusMemeWalletV3]
src = "../uranus/build/UranusMemeWalletV3/code.boc"
depends = []

[test]

[fmt]
width = 100

[scripts]
build-exact = "node ../tools/cli.mjs build x1000"
test-exact = "node ../tools/cli.mjs test x1000"

[import-mappings]
acton = ".acton"
contracts = "contracts"
tests = "tests"
wrappers = "wrappers"
